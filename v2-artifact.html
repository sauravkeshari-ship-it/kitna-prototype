<title>Kitna v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap">
<style>
/* ══════════ Airbnb design system tokens ══════════ */
:root{
  --rausch:#ff385c; --rausch-deep:#e00b41;
  --plus:#92174d; --luxe:#460479; --info:#428bff;
  --canvas:#ffffff; --cloud:#f7f7f7; --hairline:#dddddd;
  --ink:#222222; --charcoal:#3f3f3f; --ash:#6a6a6a; --mute:#929292; --stone:#c1c1c1;
  --err:#c13515;
  --cereal:"Inter","Circular",-apple-system,system-ui,"Roboto","Helvetica Neue",sans-serif;
  --dev:"Noto Sans Devanagari",var(--cereal);
  --e2:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  --e1:rgba(0,0,0,.08) 0 4px 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cloud);font-family:var(--cereal);color:var(--ink);font-weight:500;-webkit-font-smoothing:antialiased}
svg{display:block}
img{display:block;max-width:100%}
button{font-family:inherit}
.ic{width:20px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── type ── */
.t28{font-size:1.75rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.t22{font-size:1.375rem;font-weight:500;line-height:1.18;letter-spacing:-.44px}
.t20{font-size:1.25rem;font-weight:600;line-height:1.2;letter-spacing:-.18px}
.t16b{font-size:1rem;font-weight:600;line-height:1.25}
.t16{font-size:1rem;font-weight:500;line-height:1.25}
.t14{font-size:.875rem;font-weight:500;line-height:1.29}
.t14c{font-size:.875rem;font-weight:500;line-height:1.29;color:var(--ash)}
.t14b{font-size:.875rem;font-weight:600;line-height:1.43;font-feature-settings:"salt"}
.t13{font-size:.8125rem;font-weight:400;line-height:1.35;color:var(--ash)}
.t12{font-size:.75rem;font-weight:400;line-height:1.33;color:var(--ash)}
.t12b{font-size:.75rem;font-weight:700;line-height:1.33}

/* ══════════ page chrome ══════════ */
.page{max-width:80rem;margin:0 auto;padding:2rem clamp(1rem,4vw,2.5rem) 4rem;
  display:grid;grid-template-columns:minmax(0,19.5rem) auto;gap:clamp(1.5rem,4vw,3rem);
  align-items:start;justify-content:center}
@media (max-width:880px){.page{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:2rem;
  max-height:calc(100vh - 4rem);overflow-y:auto;padding-right:.4rem}
@media (max-width:880px){.side{position:static;max-height:none}}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:2px}
.brandline{font-family:var(--dev);font-weight:700;font-size:2rem;line-height:1.35;
  background:linear-gradient(90deg,#ff385c 0%,#e00b41 50%,#92174d 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.gh{padding:.9rem .5rem .35rem;border-top:1px solid var(--hairline);margin-top:.3rem;
  font-size:.75rem;font-weight:600;color:var(--ash)}
.gh:first-of-type{border-top:0;margin-top:0}
.pk{all:unset;cursor:pointer;display:grid;grid-template-columns:1.5rem 1fr;gap:.5rem;
  padding:.45rem .5rem;border-radius:8px;align-items:baseline}
.pk:hover{background:#efefef}
.pk:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ink)}
.pk[aria-current="true"]{background:var(--ink);color:#fff}
.pk[aria-current="true"] em{color:#bdbdbd}
.pk .n{font-size:.6875rem;font-weight:700;opacity:.55}
.pk .tt{font-size:.875rem;font-weight:600;line-height:1.3}
.pk em{display:block;font-style:normal;font-size:.75rem;font-weight:400;color:var(--ash);line-height:1.35;margin-top:.05rem}

/* ══════════ device ══════════ */
.device{width:393px;height:852px;background:var(--canvas);border:11px solid #1c1c1c;
  border-radius:46px;overflow:hidden;position:relative;justify-self:center;flex:none;
  box-shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 18px 40px 0}
@media (max-width:470px){.device{width:100%;max-width:393px;height:740px;border-width:8px;border-radius:34px}}
.screen{display:flex;flex-direction:column;height:100%;background:var(--canvas)}

.sb{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem .1rem;font-size:.8125rem;font-weight:600}
.sb .r{display:flex;align-items:center;gap:.3rem}
.sb .bars{display:flex;align-items:flex-end;gap:1.5px;height:9px}
.sb .bars i{width:3px;background:currentColor;border-radius:1px}
.sb .bat{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;padding:1.4px}
.sb .bat i{display:block;height:100%;width:78%;background:currentColor;border-radius:1px}

.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.body::-webkit-scrollbar{width:0}
.pad{padding:0 1.5rem}
@media (max-width:375px){.pad{padding:0 1rem}}
.col{display:flex;flex-direction:column}
.g4{gap:.25rem}.g8{gap:.5rem}.g12{gap:.75rem}.g16{gap:1rem}.g24{gap:1.5rem}.g32{gap:2rem}
.hr{height:1px;background:var(--hairline);border:0}

/* ── bars ── */
.topnav{flex:none;padding:.2rem 1.5rem .75rem;background:var(--canvas)}
.topnav.bordered{border-bottom:1px solid var(--hairline)}
.brandbar{font-family:var(--dev);font-weight:700;font-size:1.5rem;line-height:1.5;
  background:linear-gradient(90deg,#ff385c 0%,#e00b41 50%,#92174d 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.plainbar{flex:none;display:flex;align-items:center;gap:.5rem;padding:.1rem 1.5rem .8rem}
.plainbar h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.plainbar .sp{margin-left:auto;display:flex;gap:.4rem}

.cbtn{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:#f2f2f2;
  color:var(--ink);display:grid;place-items:center;transition:transform .12s,box-shadow .12s;flex:none}
.cbtn:hover{background:#ebebeb}
.cbtn:active{transform:scale(.92);box-shadow:var(--e1)}
.cbtn:focus-visible{box-shadow:0 0 0 2px var(--ink)}

/* ── buttons ── */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;overflow-wrap:break-word;
  background:var(--rausch);color:#fff;font-size:1rem;font-weight:500;padding:14px 24px;
  border-radius:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--rausch-deep)}
.btn:active{transform:scale(.96);box-shadow:0 0 0 2px var(--ink)}
.btn:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.btn.outline{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);font-weight:600}
.btn.outline:hover{background:var(--cloud)}
.btn.pill{border-radius:20px}
.btn.sm{font-size:.875rem;padding:10px 16px;width:auto}
.acts{flex:none;padding:.9rem 1.5rem 1.6rem;display:flex;flex-direction:column;gap:.6rem;background:var(--canvas)}
.inlink{color:var(--info);text-decoration:none;font-weight:500}

/* ══════════ product icon tiles ══════════ */
.tile{width:48px;height:48px;border-radius:12px;border:1px solid var(--hairline);
  background:var(--canvas);display:grid;place-items:center;flex:none;overflow:hidden}
.tile img{width:28px;height:28px;object-fit:contain}
.tile.sm{width:40px;height:40px;border-radius:10px}
.tile.sm img{width:24px;height:24px}
.tile.lg{width:64px;height:64px;border-radius:16px}
.tile.lg img{width:38px;height:38px}
.tilestack{display:flex}
.tilestack .tile{margin-left:-10px;box-shadow:0 0 0 3px var(--canvas)}
.tilestack .tile:first-child{margin-left:0}

/* compact row — the primary list unit */
.crow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;
  grid-template-columns:48px minmax(0,1fr) auto;gap:.85rem;align-items:center;padding:14px 0;
  border-bottom:1px solid var(--hairline)}
.crow:last-child{border-bottom:0}
.crow:focus-visible{box-shadow:0 0 0 2px var(--ink);border-radius:8px}
.crow .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .nm{font-size:1rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .sub{font-size:.875rem;font-weight:500;color:var(--ash);line-height:1.29;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .rt{text-align:right;flex:none}
.crow .pr{font-size:1rem;font-weight:500;line-height:1.25}
.crow .cy{font-size:.8125rem;font-weight:500;color:var(--ash)}
.crow.dim{opacity:.5}

/* idle card — bordered, no shadow, no photograph */
.icard{border:1px solid var(--hairline);border-radius:14px;padding:16px;display:flex;
  flex-direction:column;gap:.85rem}
.icard .top{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:.85rem;align-items:center}
.icard .nm{font-size:1rem;font-weight:600;line-height:1.25}
.icard .sub{font-size:.875rem;font-weight:500;color:var(--ash);margin-top:2px}
.icard .rt{text-align:right;flex:none}
.icard .pr{font-size:1rem;font-weight:500}
.icard .cy{font-size:.8125rem;font-weight:500;color:var(--ash)}
.icard .waste{display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  padding-top:.85rem;border-top:1px solid var(--hairline)}
.icard .waste .n{font-size:1.125rem;font-weight:600;color:var(--plus);line-height:1.2}
.icard .waste .l{font-size:.8125rem;font-weight:500;color:var(--ash);margin-top:1px}

.tier{font-size:.6875rem;font-weight:600;font-feature-settings:"salt"}
.tier.plus{color:var(--plus)}
.tier.luxe{color:var(--luxe)}
.tier.err{color:var(--err)}

/* worth-it flow */
.trow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
  gap:.2rem 1rem;padding:11px 0;border-bottom:1px solid var(--hairline)}
.trow:last-child{border-bottom:0}
.trow .l{font-size:.9375rem;font-weight:500;color:var(--ash);flex:1 1 8rem;min-width:0}
.trow .r2{flex:1 1 7rem;min-width:0;text-align:right}
.trow .v{font-size:.9375rem;font-weight:600;overflow-wrap:anywhere;display:block}
.trow .src{font-size:.6875rem;font-weight:500;color:var(--mute);display:block;margin-top:1px}
.wrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;
  grid-template-columns:40px minmax(0,1fr) auto;gap:.8rem;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--hairline)}
.wrow:last-child{border-bottom:0}
.wrow:focus-visible{box-shadow:0 0 0 2px var(--ink);border-radius:8px}
.wrow .nm{font-size:.9375rem;font-weight:600;line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wrow .sub{font-size:.8125rem;font-weight:500;color:var(--ash);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrow .amt{text-align:right;flex:none}
.wrow .amt .q{display:block;font-size:.625rem;font-weight:500;color:var(--mute);line-height:1.2}
.wrow .amt .n{display:block;font-size:.9375rem;font-weight:600;line-height:1.25;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.wrow .amt.cut{color:var(--plus)}
.wrow .amt.maybe{color:var(--ash);font-weight:600}
.wrow .amt.ok{color:var(--ash);font-weight:500}

.tcard{border:1px solid var(--hairline);border-radius:20px;padding:20px;
  display:flex;flex-direction:column;gap:1rem;box-shadow:var(--e2)}
.tcard .who{display:flex;align-items:center;gap:.85rem}
.tcard .who .nm{font-size:1.0625rem;font-weight:700;line-height:1.2}
.tcard .who .pr{font-size:.875rem;font-weight:500;color:var(--ash);margin-top:2px}
.tcard .head{font-size:1.375rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tcard .alt{font-size:.875rem;font-weight:500;color:var(--ash);line-height:1.5;
  padding-top:.9rem;border-top:1px solid var(--hairline)}
.tcard .save{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .4rem;font-variant-numeric:tabular-nums}
.tcard .save .n{font-size:1.5rem;font-weight:700;color:var(--plus);letter-spacing:-.02em}
.tcard .save .l{font-size:.8125rem;font-weight:500;color:var(--ash)}

.prog{display:flex;align-items:center;gap:.6rem}
.prog .track{flex:1;height:4px;background:#ebebeb;border-radius:2px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ink);border-radius:2px}
.prog .n{font-size:.6875rem;font-weight:600;color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}

.ba{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.75rem;align-items:center;
  border:1px solid var(--hairline);border-radius:16px;padding:16px}
.ba .c{text-align:center}
.ba .k{font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  font-feature-settings:"salt";color:var(--ash)}
.ba .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.25rem;letter-spacing:-.02em}
.ba .v.old{color:var(--ash);text-decoration:line-through;font-weight:500}

/* solid grounds — one confident block per screen, never two */
.artbox{border-radius:20px;display:grid;place-items:center;padding:1.1rem 0;margin-top:.25rem}
.artbox.cloud{background:var(--cloud)}
.artbox.rausch{background:var(--rausch)}
.artbox.luxe{background:var(--luxe)}
.artbox.rausch svg [stroke="#222222"], .artbox.luxe svg [stroke="#222222"],
.artbox.rausch svg [stroke="#ff385c"], .artbox.luxe svg [stroke="#ff385c"]{stroke:#fff}
.artbox.rausch svg [stroke="#dddddd"], .artbox.luxe svg [stroke="#dddddd"]{stroke:rgba(255,255,255,.55)}
.artbox.rausch svg [fill="#f7f7f7"], .artbox.luxe svg [fill="#f7f7f7"]{fill:rgba(255,255,255,.3)}
.artbox.rausch svg text, .artbox.luxe svg text{fill:#fff}

.solid{border-radius:20px;padding:20px;color:#fff}
.solid.ink{background:var(--ink)}
.solid.plus{background:var(--plus)}
.solid .k{font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  font-feature-settings:"salt";color:rgba(255,255,255,.72)}
.solid .big{font-size:2.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-top:.35rem}
.solid .sub{font-size:.875rem;font-weight:500;line-height:1.45;color:rgba(255,255,255,.82);margin-top:.5rem}
.solid .tile{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
.solid .tilestack .tile{box-shadow:0 0 0 3px var(--ink)}

/* small line art */
.art{display:grid;place-items:center;padding:.75rem 0}
.art svg{width:210px;height:140px}
.art.mini svg{width:150px;height:100px}

/* ══════════ award lockup ══════════ */
.award{display:flex;flex-direction:column;align-items:center;text-align:center}
.award .lock{display:flex;align-items:center;justify-content:center;gap:.4rem}
.award .lock svg{height:60px;width:auto;flex:none}
.award .num{font-size:3.25rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.award .cap{font-size:.75rem;font-weight:700;letter-spacing:.32px;text-transform:uppercase;margin-top:.6rem}
.award .sub{font-size:.875rem;font-weight:500;color:var(--ash);margin-top:.35rem;max-width:19rem;line-height:1.4}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline)}
.stats>div{padding:14px 8px;text-align:center;border-right:1px solid var(--hairline)}
.stats>div:last-child{border-right:0}
.stats .k{font-size:.75rem;font-weight:500;color:var(--ash);line-height:1.3}
.stats .v{font-size:1.125rem;font-weight:600;margin-top:2px}
.stats .v.err{color:var(--err)}

/* ══════════ financial hero ══════════ */
.eyebrow{font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  font-feature-settings:"salt";color:var(--ink)}
.asof{font-size:.75rem;font-weight:400;color:var(--ash);font-variant-numeric:tabular-nums}
.bignum{font-size:3.25rem;font-weight:700;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:.3rem;font-size:.8125rem;font-weight:600;
  border:1px solid var(--hairline);border-radius:20px;padding:5px 11px 5px 8px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--err);border-color:#eccfc7}
.delta.flat{color:var(--ash)}
.delta .ic{width:14px;height:14px;stroke-width:2.4}

.minihd{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
.minihd .l{font-size:.6875rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  font-feature-settings:"salt";color:var(--ash)}
.minihd .v{font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums}

.trend{display:flex;align-items:flex-end;gap:6px;height:54px}
.trend div{flex:1;background:#ebebeb;border-radius:3px 3px 0 0;position:relative;min-height:4px}
.trend div.now{background:var(--ink)}
.trend div b{position:absolute;bottom:-18px;left:0;right:0;text-align:center;
  font-size:.625rem;font-weight:500;color:var(--ash)}
.trend div.now b{color:var(--ink);font-weight:600}

.mixbar{display:flex;height:10px;border-radius:5px;overflow:hidden}
.mixbar i{display:block;box-sizing:border-box;border-right:2px solid var(--canvas)}
.mixbar i:last-child{border-right:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .9rem}
.legend div{display:flex;align-items:center;gap:.4rem;min-width:0;font-size:.75rem;font-weight:500}
.legend .sw2{width:8px;height:8px;border-radius:2px;flex:none}
.legend .n2{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .p2{margin-left:auto;color:var(--ash);font-variant-numeric:tabular-nums;flex:none}

/* verdict chips + evidence */
.vchip{display:inline-flex;align-items:center;gap:.3rem;font-size:.6875rem;font-weight:600;
  font-feature-settings:"salt";padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.vchip.confirmed{color:#fff;background:var(--plus);border-color:var(--plus)}
.vchip.unknown{color:var(--ash);border-color:var(--hairline)}
.vchip.unseeable{color:var(--luxe);border-color:#c9b8dc}
.evid{display:grid;grid-template-columns:18px minmax(0,1fr);gap:.6rem;align-items:start;
  font-size:.8125rem;font-weight:500;color:var(--ash);line-height:1.4;padding:9px 0}
.evid .y{color:var(--ink)}
.evid .n{color:var(--stone)}
.askrow{display:flex;gap:.5rem;padding-top:.85rem;border-top:1px solid var(--hairline)}
.askrow .btn{flex:1;width:auto;padding:10px 12px;font-size:.8125rem}
.optional{display:inline-block;font-size:.6875rem;font-weight:600;font-feature-settings:"salt";
  color:var(--ash);border:1px solid var(--hairline);border-radius:20px;padding:3px 9px}

/* priority card — semantic Error Red, sits above everything */
.prio{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center;
  background:var(--err);color:#fff;border:0;border-radius:14px;padding:14px 16px;
  width:100%;box-sizing:border-box;cursor:pointer;text-align:left;font-family:inherit;
  transition:transform .12s,background .12s}
.prio:hover{background:#b32505}
.prio:active{transform:scale(.985)}
.prio:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.prio .t{display:block;font-size:1rem;font-weight:600;line-height:1.25}
.prio .d{display:block;font-size:.8125rem;font-weight:500;line-height:1.3;margin-top:2px;
  color:rgba(255,255,255,.84)}

/* full-fold hero card */
.herowrap{padding:.85rem 12px 0;display:flex;flex-direction:column;gap:.85rem}
.hero{background:var(--canvas);border:1px solid var(--hairline);border-radius:20px;
  box-shadow:var(--e2);padding:20px 20px 0;display:flex;flex-direction:column;overflow:hidden}
.hero .grow{display:flex;flex-direction:column;gap:.45rem;padding:.9rem 0 1.2rem}
.hero .stats{margin:0 -20px;border-bottom:0}

/* disclosure */

/* ═══════════ helpers ═══════════ */
function rs(n){ return "₹" + n.toLocaleString("en-IN"); }
function ic(id, cls){ return '<svg class="ic '+(cls||"")+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
function all(){ return SETS[STATE].map(function(k){ return SUBS[k]; }); }
function leaks(){ return all().filter(function(s){ return !s.planned; }); }
function planned(){ return all().filter(function(s){ return s.planned; }); }
function idles(){ return leaks().filter(function(s){ return s.idle >= 60; }); }
function active(){ return leaks().filter(function(s){ return s.idle < 60; }); }
function yearly(l){ return l.reduce(function(t,s){ return t + (s.cy==="yearly" ? s.a : s.a*12); },0); }
function monthly(l){ return l.reduce(function(t,s){ return t + (s.cy==="yearly" ? Math.round(s.a/12) : s.a); },0); }
function within(n){ return leaks().filter(function(s){ return s.d <= n; }); }
function sumA(l){ return l.reduce(function(t,s){ return t+s.a; },0); }
function perYear(s){ return s.cy==="yearly" ? s.a : s.a*12; }
function cyc(s){ return s.cy==="yearly" ? "per year" : "per month"; }

/* ── what Kitna is allowed to claim about each subscription ──
   confirmed : this phone can see it, and has not seen it in 60+ days
   unknown   : used on other devices too, so silence here proves nothing
   unseeable : passive or app-less. never flag these, there is no signal   */
function verdict(s){
  if (MUTED[s.n]) return "muted";
  if (s.obs === "passive") return "unseeable";
  if (s.ev !== "none" || s.idle < 60) return "used";
  return s.obs === "direct" ? (USAGE ? "confirmed" : "unknown") : "unknown";
}
function byVerdict(v){ return leaks().filter(function(s){ return verdict(s) === v; }); }
function worthList(){ return WORTH.filter(function(w){ return SETS[STATE].indexOf(w.k) >= 0; }); }
function toDecide(){ return worthList().filter(function(w){ return w.v !== "keep"; }); }
function firmSave(){ return worthList().filter(function(w){ return w.kind === "firm" && w.save; })
  .reduce(function(t,w){ return t + w.save; }, 0); }
function potentialSave(){ return worthList().filter(function(w){ return w.kind === "potential"; })
  .reduce(function(t,w){ return t + w.save; }, 0); }
function recoverable(){ return firmSave(); }
function unjudgeable(){ return potentialSave(); }
function recovered(){ return Object.keys(DECIDED).reduce(function(t,k){
  var w = WORTH.filter(function(x){ return x.k === k; })[0];
  return t + (DECIDED[k] === "kept" ? 0 : (w ? w.save : 0)); }, 0); }
function evidenceLabel(s){
  if (s.ev === "app")   return "Opened on this phone " + (s.idle <= 1 ? "today" : s.idle + " days ago");
  if (s.ev === "notif") return "Order confirmed " + s.idle + " days ago, seen in notifications";
  if (s.obs === "passive") return "Runs without an app to open";
  return "No sign of use on this phone since " + (s.last || "install");
}
function permo(s){ return s.cy==="yearly" ? Math.round(s.a/12) : s.a; }
function mix(){
  var by = {}, tot = monthly(leaks());
  leaks().forEach(function(s){ by[s.cat] = (by[s.cat]||0) + permo(s); });
  var rows = Object.keys(by).map(function(k){ return {k:k, v:by[k], p:by[k]/tot*100}; })
    .sort(function(a,b){ return b.v - a.v; });
  if (rows.length > 6){
    var rest = rows.slice(5).reduce(function(t,r){ return t+r.v; },0);
    rows = rows.slice(0,5).concat([{k:"Other", v:rest, p:rest/tot*100}]);
  }
  return rows;
}

S.upcoming = function(){

    return '<div class="screen">' + statusbar() + plainbar("Upcoming")
     + '<div class="body"><div class="pad"><div class="empty">'

     + '<h2>Nothing scheduled</h2><p>Charges show up here before they leave, so you can keep the balance ready.</p>'
     + '</div></div></div>' + tabbar("upcoming") + '</div>';
  }
  var WD = ["Thu","Fri","Thu","Sun","Wed","Sat","Tue","Wed","Sun","Tue","Mon","Fri"];
  function when(d,i){
    if (d<=1) return "tomorrow";
    if (d<=7) return (WD[i]||"")+" · in "+d+" days";
    return WD[i]||"";
  }
  var groups = {}, order = [];
  L.forEach(function(s){ if(!groups[s.next]){groups[s.next]=[];order.push(s.next);} groups[s.next].push(s); });

  var body = '<div class="pad col g24" style="padding-bottom:1.5rem">';
  if (idles().length){
    body += notice({err:1, icon:"i-alert", t:"HDFC ···4412 has ₹1,240",
      d:"Three charges land before your 1 Oct salary. Two will bounce, costing ₹236."});
  }
  order.forEach(function(date,i){
    var g = groups[date], hot = g.some(function(s){ return s.d<=3; });
    body += '<div class="col g8">'
     + '<div class="sh"><h2>'+date+'</h2><span class="side2"'+(hot?' style="color:var(--err);font-weight:600"':'')+'>'
     +   when(g[0].d,i)+' · '+rs(sumA(g))+'</span></div>'
     + '<div>' + g.map(function(s){
         return crow(s, {sub: s.planned ? "Kept out of the total" : s.pay,
                         tier: s.planned ? "luxe" : (s.idle>=60 ? "plus" : "")});
       }).join("") + '</div></div>';
  });
  body += notice({icon:"i-check", t:"Salary lands 1 Oct", d:"Everything after that clears"}) + '</div>';

var device = document.getElementById("device");
var picker = document.getElementById("picker");

VIEWS.forEach(function(g){
  var h = document.createElement("div");
  h.className = "gh"; h.textContent = g[0];
  picker.appendChild(h);
  g[1].forEach(function(v){
    var b = document.createElement("button");
    b.className = "pk"; b.dataset.go = v[0];
    b.innerHTML = '<span class="n">'+v[1]+'</span><span class="tt">'+v[2]+'<em>'+v[3]+'</em></span>';
    picker.appendChild(b);
  });
});

function show(target){
  var p = String(target).split(":"), key = p[0];
  if (p[1]) STATE = p[1];
  if (p[2]) USAGE = (p[2] === "on");
  if (key === "worth"){ TI = 0; DECIDED = {}; }
  if (!S[key]) return;
  device.innerHTML = S[key]();
  picker.querySelectorAll(".pk").forEach(function(b){
    var k = b.dataset.go.split(":");
    b.setAttribute("aria-current", (k[0]===key && (!k[1] || k[1]===STATE)) ? "true" : "false");
  });
}

var side = document.getElementById("side");
function mobile(){ return window.matchMedia("(max-width:720px)").matches; }
document.getElementById("protobtn").addEventListener("click", function(){ side.classList.add("open"); });

document.addEventListener("click", function(e){
  if (e.target.closest("[data-sideclose]")){ side.classList.remove("open"); return; }
  var sw = e.target.closest("[data-sw]");
  if (sw){ sw.classList.toggle("on"); return; }
  var dh = e.target.closest("[data-disc]");
  if (dh){ dh.parentNode.classList.toggle("open"); return; }
  var mb = e.target.closest("[data-more]");
  if (mb){ mb.parentNode.classList.toggle("open"); return; }
  var dec = e.target.closest("[data-decide]");
  if (dec){
    var parts = dec.getAttribute("data-decide").split(":");
    DECIDED[parts[0]] = parts[1];
    TI++;
    show("triage");
    return;
  }
  if (e.target.closest("[data-restart]")){ TI = 0; DECIDED = {}; show("worth"); return; }
  var mu = e.target.closest("[data-mute]");
  if (mu){
    MUTED[mu.getAttribute("data-mute")] = true;
    show(mu.getAttribute("data-go") || "dead");
    return;
  }
  var c = e.target.closest(".chipb");
  if (c){
    var grp = c.closest("[data-chipgroup]");
    if (grp){ grp.querySelectorAll(".chipb").forEach(function(x){ x.classList.remove("on"); }); c.classList.add("on"); return; }
  }
  var t = e.target.closest("[data-go]");
  if (!t) return;
  e.preventDefault();
  show(t.dataset.go);
  if (mobile() && t.classList.contains("pk")) side.classList.remove("open");
});

show("home:full:on");
